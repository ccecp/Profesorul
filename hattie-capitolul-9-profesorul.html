<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Învățarea vizibilă</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--accent:#2949a6;--ok:#137333;--bad:#b42318;--border:#d9dfeb}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:980px;margin:0 auto;padding:22px}.hero,.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px}.hero{margin-bottom:18px}
h1{font-size:32px;margin:0}.meta{color:var(--muted);line-height:1.6}
.module-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}
.module-btn{border:1px solid var(--border);background:#fff;border-radius:14px;padding:16px;text-align:left;cursor:pointer;font-weight:700;color:var(--text)}
.module-btn small{display:block;color:var(--muted);font-weight:400;margin-top:5px}
.audio{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:11px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef1f6;color:#26324d}
.progress{height:10px;background:#e9edf4;border-radius:999px;overflow:hidden;margin:12px 0 18px}.progress>div{height:100%;background:var(--accent);width:0}
.qnum{color:var(--muted);font-size:14px}.section{font-size:14px;color:var(--accent);font-weight:700;margin-bottom:8px}.question{font-size:21px;line-height:1.5;margin:8px 0 18px;font-weight:700}
.options{display:grid;gap:10px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:12px;padding:13px;cursor:pointer;background:#fff}.option.correct{border-color:#70b77e;background:#edf8ef}.option.wrong{border-color:#e29a94;background:#fff1f0}
.feedback{margin-top:16px;padding:13px 15px;border-radius:12px;font-weight:700;display:none}.feedback.ok{display:block;background:#edf8ef;color:var(--ok)}.feedback.bad{display:block;background:#fff1f0;color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hidden{display:none}.score{font-size:34px;font-weight:800;color:var(--accent)}
@media(max-width:600px){.wrap{padding:12px}.hero,.card{padding:16px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<h1>Învățarea vizibilă</h1>
<div class="module-grid">
<button class="module-btn" onclick="startModule('tabel')">Așteptările – Tabelul 9.4<small>10 itemi</small></button>
<button class="module-btn" onclick="startModule('asteptari')">Așteptările – idei esențiale<small>3 itemi</small></button>
<button class="module-btn" onclick="startModule('atractivitate')">Atractivitatea fizică<small>2 itemi</small></button>
<button class="module-btn" onclick="startModule('neetichetare')">Neetichetarea elevilor<small>5 itemi</small></button>
<button class="module-btn" onclick="startModule('estimari')">Estimările profesorilor cu privire la performanță<small>5 itemi</small></button>
<button class="module-btn" onclick="startModule('credibilitate')">Credibilitatea profesorului<small>3 itemi</small></button>
<button class="module-btn" onclick="startModule('claritate')">Claritatea profesorului<small>5 itemi</small></button>
<button class="module-btn" onclick="startModule('eficacitate')">Eficacitatea colectivă a profesorilor<small>10 itemi</small></button>
</div>
</section>

<section class="card hidden" id="quizCard">
<div class="qnum" id="qnum"></div><div class="section" id="section"></div>
<div class="progress"><div id="bar"></div></div>
<div class="question" id="question"></div><div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="audio">
<button class="btn secondary" id="listen">🔊 Ascultă itemul</button>
<button class="btn secondary" id="pause">⏸ Pauză</button>
<button class="btn secondary" id="resume">▶ Continuă</button>
<button class="btn secondary" id="stop">■ Oprește</button>
</div>
<div class="actions">
<button class="btn primary" id="check">Verifică răspunsul</button>
<button class="btn secondary" id="next" disabled>Următorul</button>
<button class="btn secondary" id="backHome">Alege alt modul</button>
</div>
</section>

<section class="card hidden" id="resultCard">
<h2>Ai terminat modulul.</h2>
<div class="score" id="score"></div>
<div class="meta" id="scoreText"></div>
<div class="actions">
<button class="btn primary" id="restart">Reia modulul</button>
<button class="btn secondary" id="backHome2">Alege alt modul</button>
</div>
</section>
</div>

<script>
const modules={
tabel:[
{sec:'Așteptările – Tabelul 9.4',q:'În Tabelul 9.4, Hattie compară practicile profesorilor cu așteptări reduse și ale celor cu așteptări ridicate. Cum își văd rolul profesorii cu așteptări ridicate?',o:['Ca facilitatori, constructiviști și socializatori.','Ca supraveghetori, agenți activi de schimbare și instructori academici.','Ca observatori pasivi ai progresului elevilor.','Ca administratori ai procedurilor și rutinelor.'],a:1},
{sec:'Așteptările – Tabelul 9.4',q:'Potrivit Tabelului 9.4, care afirmație descrie corect modul în care profesorii cu așteptări ridicate privesc inteligența și progresul elevilor?',o:['Au opinii ferme despre abilități și consideră performanța în mare parte fixă.','Au convingeri flexibile despre inteligență și susțin că se așteaptă ca toți să progreseze.','Se așteaptă la îmbunătățiri numai de la elevii foarte înzestrați.','Consideră că diferențele dintre elevi trebuie menținute prin grupe rigide.'],a:1},
{sec:'Așteptările – Tabelul 9.4',q:'În ceea ce privește gruparea elevilor, care practică este asociată în Tabelul 9.4 profesorilor cu așteptări ridicate?',o:['Plasează elevii în grupe de abilități destul de rigide.','Folosesc în special grupe bazate pe interese.','Separă permanent elevii foarte înzestrați de cei slab înzestrați.','Diferențiază clar activitățile educative în funcție de nivelul presupus al abilității.'],a:1},
{sec:'Așteptările – Tabelul 9.4',q:'Cum sunt descrise activitățile educative oferite elevilor de către profesorii cu așteptări ridicate?',o:['Le cer tuturor elevilor să participe la activități educative similare.','Oferă elevilor slab înzestrați mai ales activități repetitive și de nivel scăzut.','Le cer elevilor foarte înzestrați și celor slab înzestrați activități foarte diferite.','Îi lasă pe elevii foarte înzestrați să lucreze independent în majoritatea timpului.'],a:0},
{sec:'Așteptările – Tabelul 9.4',q:'Care dintre următoarele diferențe privind obiectivele de lucru apare în Tabelul 9.4?',o:['Profesorii cu așteptări ridicate subliniază obiective de performanță, iar cei cu așteptări reduse obiective de îndeplinire a sarcinilor.','Profesorii cu așteptări ridicate subliniază obiective de îndeplinire a sarcinilor și îi antrenează pe toți în activități avansate.','Ambele categorii folosesc exclusiv obiective de performanță.','Profesorii cu așteptări reduse îi antrenează pe toți elevii în activități avansate.'],a:1},
{sec:'Așteptările – Tabelul 9.4',q:'În Tabelul 9.4, cum este descrisă distribuirea atenției profesorului către elevi în cazul așteptărilor ridicate?',o:['Petrec mai mult timp cu elevii slab înzestrați și îi lasă pe cei foarte înzestrați să lucreze independent.','Lucrează în mod egal cu toți.','Lucrează numai cu elevii care manifestă interes spontan.','Își concentrează timpul pe elevii considerați cei mai capabili.'],a:1},
{sec:'Așteptările – Tabelul 9.4',q:'Care este centrul activității profesorilor cu așteptări ridicate, potrivit Tabelului 9.4?',o:['Activitățile și comportamentele.','Învățarea.','Procedurile și rutinele.','Diferențierea permanentă a sarcinilor.'],a:1},
{sec:'Așteptările – Tabelul 9.4',q:'Cum diferă întrebările utilizate de profesorii cu așteptări ridicate față de cei cu așteptări reduse?',o:['Profesorii cu așteptări ridicate pun mai ales întrebări închise.','Profesorii cu așteptări ridicate pun mai multe întrebări de impact, deschise și închise.','Profesorii cu așteptări reduse folosesc mai multe întrebări de impact deschise.','Tabelul nu indică nicio diferență privind tipul întrebărilor.'],a:1},
{sec:'Așteptările – Tabelul 9.4',q:'Care variantă descrie corect feedbackul și climatul creat de profesorii cu așteptări ridicate?',o:['Fac mai multe afirmații negative și oferă puține laude.','Generează o încredere ridicată, oferă mai mult feedback și analize critice și se concentrează pe strategii de viitor.','Manifestă o încredere scăzută și se concentrează pe comportament.','Reduc evaluarea și monitorizarea pentru a acorda elevilor mai multă autonomie.'],a:1},
{sec:'Așteptările – Tabelul 9.4',q:'În ceea ce privește cunoștințele prealabile și adaptarea lecției, ce fac profesorii cu așteptări ridicate?',o:['Folosesc într-o mică măsură cunoștințele prealabile și nu se abat de la notițele făcute pentru lecții.','Folosesc mai frecvent cunoștințele prealabile pentru a face conexiuni și modifică lecțiile în funcție de nevoile elevilor.','Evită adaptarea lecției pentru a păstra aceleași cerințe pentru toți.','Folosesc cunoștințele prealabile numai pentru elevii foarte înzestrați.'],a:1}
],
asteptari:[
{sec:'Așteptările – din text',q:'Hattie arată că problema centrală nu este dacă profesorii au sau nu așteptări, ci natura acestor așteptări și efectul lor asupra învățării. Care dintre următoarele formulări redă cel mai fidel ideea din text?',o:['Așteptările profesorilor sunt inevitabile, dar nu modifică performanța elevilor.','Așteptările profesorilor pot fi false și înșelătoare și pot duce la descreșteri sau creșteri în învățare.','Așteptările profesorilor contează numai pentru elevii cu performanțe ridicate.','Așteptările trebuie reduse pentru a evita presiunea asupra elevilor.'],a:1},
{sec:'Așteptările – din text',q:'Conform analizei prezentate în secțiunea „Așteptările”, ce observă elevii în legătură cu așteptările profesorilor?',o:['Elevii nu percep diferențele de tratament dintre ei.','Elevii știu că sunt tratați diferit în clasă în funcție de așteptările profesorilor și pot identifica destul de exact aceste diferențe.','Elevii percep diferențele doar atunci când profesorul le comunică explicit.','Elevii sunt influențați exclusiv de așteptările colegilor, nu de cele ale profesorilor.'],a:1},
{sec:'Așteptările – din text',q:'În concluzia secțiunii, Hattie formulează câteva recomandări pentru evitarea efectelor așteptărilor nefavorabile. Care variantă corespunde textului?',o:['Profesorii trebuie să păstreze așteptări uniforme și să evite verificarea lor prin dovezi.','Profesorii trebuie să aibă așteptări stimulative, adecvate și verificabile, astfel încât toți elevii să realizeze ceea ce este considerat important.','Profesorii trebuie să adapteze așteptările exclusiv la performanța anterioară a fiecărui elev.','Profesorii trebuie să reducă nivelul așteptărilor pentru elevii aflați la început.'],a:1}
],
atractivitate:[
{sec:'Așteptările – atractivitatea fizică',q:'Hattie arată că, atunci când întâlnim oameni, ne formăm rapid așteptări și că aspectul fizic influențează aceste judecăți. Care variantă reproduce cel mai fidel ideea din text?',o:['Persoanele atractive fizic sunt considerate mai ales mai disciplinate, fără legătură cu inteligența sau sociabilitatea.','Persoanele atractive fizic sunt mai probabil considerate superioare în abilități sociale, inteligență și sănătate și ca având atitudini mai calde și mai prietenești.','Atractivitatea fizică influențează exclusiv deciziile de angajare, nu și evaluările școlare.','Atractivitatea fizică nu influențează așteptările profesorilor privind elevii.'],a:1},
{sec:'Așteptările – atractivitatea fizică',q:'În analiza relației dintre atractivitatea fizică și evaluarea elevilor, ce concluzie este prezentată în text?',o:['Profesorii tind să evalueze elevii atractivi mai slab la indicatorii academici, pentru a compensa prejudecățile.','Atractivitatea elevilor este asociată cu evaluări ale profesorilor privind inteligența, potențialul academic viitor și notele, iar profesorii sunt mai înclinați să recomande programe pentru nevoi speciale copiilor neatractivi decât celor atractivi.','Efectul atractivității apare numai la elevii cu performanțe anterioare ridicate.','Sexul și rasa elevilor explică în totalitate relația dintre atractivitate și evaluarea profesorilor.'],a:1}
],
neetichetare:[
{sec:'Neetichetarea elevilor',q:'Hattie atrage atenția că repartizarea elevilor în grupuri și atașarea unor etichete poate avea consecințe asupra modului în care aceștia sunt percepuți și sprijiniți. Care este riscul central evidențiat în text?',o:['Etichetarea duce automat la o finanțare mai mare și la rezultate mai bune.','Etichetarea grupului poate conduce la așteptări scăzute față de elevii din acel grup și la tratarea lor ca fiind asemănători între ei.','Etichetarea este utilă numai pentru elevii cu rezultate ridicate.','Etichetarea elimină diferențele dintre elevi și face predarea mai eficientă.'],a:1},
{sec:'Neetichetarea elevilor',q:'În studiile citate de Hattie privind elevii cu performanțe scăzute la citire, ce rezultat este prezentat?',o:['Elevii etichetați cu dificultăți de învățare au avut în mod constant rezultate superioare celor neetichetați.','Nu au existat diferențe între elevii etichetați și cei neetichetați.','O proporție mare dintre elevii slab performanți, dar neetichetați, au avut scoruri la citire peste media celor slab performanți etichetați.','Etichetarea a avut efect doar asupra comportamentului, nu și asupra performanței la citire.'],a:2},
{sec:'Neetichetarea elevilor',q:'Hattie folosește analogia diagnosticului medical pentru a clarifica rolul evaluării în educație. Care este concluzia corectă?',o:['Diagnosticul trebuie să fie concluzia finală care explică de ce elevul nu poate progresa.','Diagnosticul este prima etapă pentru alegerea unei intervenții adecvate și nu ar trebui să fie niciodată ultimul pas.','Diagnosticul trebuie evitat deoarece orice diagnostic produce etichetare.','Diagnosticul este util doar pentru raportare administrativă.'],a:1},
{sec:'Neetichetarea elevilor',q:'În exemplul referitor la sistemul școlar din Singapore, ce formulare este preferată în locul unor etichete tradiționale?',o:['Elevi cu risc ridicat.','Elevi cu progres lent.','Elevi cu abilități reduse.','Elevi cu nevoi permanente.'],a:1},
{sec:'Neetichetarea elevilor',q:'Care este direcția recomandată de Hattie în raport cu etichetele și intervenția educațională?',o:['Etichetele trebuie atașate copilului pentru a permite adaptarea pe termen lung.','Etichetele trebuie folosite pentru a diagnostica probleme de învățare și pentru a orienta intervenții bazate pe dovezi, cu accent pe progres și accelerare.','Etichetele trebuie folosite pentru a separa elevii în grupuri omogene permanente.','Etichetele trebuie înlocuite exclusiv cu aprecieri generale despre comportament.'],a:1}
],,
estimari:[
{sec:'Estimările profesorilor cu privire la performanță',q:'Profesorii fac constant aprecieri despre abilitățile elevilor și, pe baza acestora, stabilesc cerințele de învățare și sarcinile de lucru. Ce avantaj au profesorii ale căror aprecieri sunt mai precise?',o:['Pot evita folosirea feedbackului pentru a nu influența elevul.','Pot calibra mai bine dificultatea sarcinilor și pot oferi un feedback orientat spre dezvoltare.','Pot renunța la metodele standard de evaluare.','Pot stabili mai ușor grupe fixe de abilități.'],a:1},
{sec:'Estimările profesorilor cu privire la performanță',q:'Hattie arată că aprecierile profesorilor pot fi influențate de factori care nu reprezintă direct performanța elevului. Care dintre următoarele variante corespunde textului?',o:['Susținerea familiei, abilitățile sociale, comportamentul disciplinat și sexul pot influența greșit aprecierile profesorilor.','Numai punctajele la testele standardizate influențează aprecierile profesorilor.','Aprecierile profesorilor sunt independente de orice factor exterior performanței.','Doar nivelul școlii influențează precizia aprecierilor.'],a:0},
{sec:'Estimările profesorilor cu privire la performanță',q:'Ce recomandare formulează Hattie pentru a reduce riscul unor aprecieri greșite despre elevi?',o:['Profesorii trebuie să își formeze rapid o opinie generală și să o păstreze constantă.','Profesorii trebuie să mențină un grad de incertitudine, să caute informații despre elevi și să își trianguleze, testeze și reexamineze aprecierile.','Profesorii trebuie să se bazeze exclusiv pe impresia inițială despre elev.','Profesorii trebuie să evite orice comparație cu performanța reală a elevului.'],a:1},
{sec:'Estimările profesorilor cu privire la performanță',q:'În locul întrebării generale „Cât de bun este acest elev?”, ce abordare este recomandată în text?',o:['Să se analizeze realizările elevului într-un domeniu specific.','Să se analizeze exclusiv comportamentul elevului.','Să se folosească numai reputația elevului în clasă.','Să se decidă pe baza nivelului general al familiei.'],a:0},
{sec:'Estimările profesorilor cu privire la performanță',q:'Care este concluzia lui Hattie despre elevii cu rezultate mai slabe?',o:['Rezultatele slabe indică faptul că elevul va rămâne probabil în urmă.','Elevii cu rezultate mai slabe trebuie să primească sarcini mai ușoare pe termen lung.','Profesorul trebuie să se asigure că fiecare elev, indiferent de punctul de plecare, progresează în salturi mari la ore.','Elevii cu rezultate slabe trebuie evaluați separat de ceilalți.'],a:2}
],,
credibilitate:[
{sec:'Credibilitatea profesorului',q:'Ce înseamnă, în esență, credibilitatea profesorului în analiza lui Hattie?',o:['Convingerea elevilor că profesorul este strict și menține disciplina.','Credința elevilor că pot învăța de la acel profesor deoarece îl percep ca fiind credibil, elocvent și capabil să îi asigure că pot avea succes.','Capacitatea profesorului de a obține rezultate bune fără să țină cont de percepția elevilor.','Reputația profesorului în rândul colegilor și al conducerii școlii.'],a:1},
{sec:'Credibilitatea profesorului',q:'De ce factori depinde credibilitatea profesorului, potrivit textului?',o:['De vechime, titluri academice și numărul de ore predate.','De încrederea acordată profesorului, competența sa, pasiunea pentru materie și dorința ca elevii să învețe.','Exclusiv de nivelul de dificultate al disciplinei.','De popularitatea profesorului în afara școlii.'],a:1},
{sec:'Credibilitatea profesorului',q:'Ce efect este asociat cu perceperea profesorului drept atent, înțelegător și receptiv?',o:['Elevii devin mai puțin dependenți de profesor și evită cursurile lui viitoare.','Elevii manifestă motivație mai mare, o învățare cognitivă superioară și o probabilitate mai mare de a alege din nou cursul sau de a recomanda profesorul.','Elevii acordă mai puțină importanță competenței profesorului.','Elevii își reduc așteptările privind succesul școlar.'],a:1}
],,
claritate:[
{sec:'Claritatea profesorului',q:'Potrivit modelului prezentat de Hattie, care sunt cei cinci factori ai clarității instructorului?',o:['Fluență, ritm, autoritate, evaluare și structură.','Lipsă de fluență, supraîncărcare, interacțiune, coerență și structură.','Competență, pasiune, încredere, feedback și organizare.','Explicare, evaluare, disciplină, ritm și relaționare.'],a:1},
{sec:'Claritatea profesorului',q:'Ce înseamnă „interacțiunea” în modelul clarității profesorului?',o:['Profesorul transmite informațiile fără întreruperi pentru a evita pierderea ritmului.','Profesorul lucrează cu elevii pentru a determina nivelul lor de înțelegere și își ajustează demersurile didactice în funcție de acesta.','Profesorul reduce numărul de exemple pentru a menține lecția concisă.','Profesorul folosește doar explicații generale, fără întrebări din partea elevilor.'],a:1},
{sec:'Claritatea profesorului',q:'Care afirmație exprimă cel mai bine ideea că claritatea înseamnă mai mult decât simpla înțelegere a explicației?',o:['Profesorul trebuie să vorbească mai tare și să evite orice ambiguitate.','Profesorul trebuie să fie explicit privind criteriile succesului, să alinieze lecția, sarcinile și temele și să ofere exemple și feedback relevant.','Profesorul trebuie să simplifice toate sarcinile până când elevii nu mai întâmpină dificultăți.','Profesorul trebuie să respecte rigid notițele și structura inițială a lecției.'],a:1},
{sec:'Claritatea profesorului',q:'Ce concluzie rezultă din datele prezentate despre claritatea profesorului?',o:['Efectele apar doar la disciplinele verbale și la profesorii cu experiență.','Efectele sunt similare la discipline verbale și numerice, la clase de dimensiuni diferite și la profesori cu niveluri diferite de experiență.','Efectele sunt relevante doar în clasele mici.','Claritatea contează doar când este evaluată de observatori externi.'],a:1},
{sec:'Claritatea profesorului',q:'Ce avertisment apare în text cu privire la claritate și organizarea lecției?',o:['Claritatea cere eliminarea completă a oricărei ambiguități.','Claritatea presupune superorganizarea lecției în fiecare situație.','Claritatea nu trebuie confundată cu superorganizarea; o anumită ambiguitate poate fi permisă ocazional.','Claritatea este incompatibilă cu adaptarea lecției la nevoile elevilor.'],a:2}
],,
eficacitate:[
{sec:'Eficacitatea colectivă a profesorilor',q:'Cum este descrisă ideea de eficacitate colectivă în analiza inspirată de Bandura?',o:['Ca încrederea unui profesor în propriile competențe individuale.','Ca încrederea unui grup că, prin efortul său unit, poate depăși dificultăți și obține rezultatele dorite.','Ca respectarea aceleiași metode de predare de către toți profesorii.','Ca existența unor relații cordiale între membrii colectivului.'],a:1},
{sec:'Eficacitatea colectivă a profesorilor',q:'Ce trebuie să se afle în centrul convingerilor despre eficacitatea colectivă?',o:['Numărul întâlnirilor dintre profesori.','Semnificația impactului și modul în care nivelurile impactului pot fi diagnosticate și evaluate.','Uniformitatea stilurilor de predare.','Respectarea strictă a aceleiași planificări.'],a:1},
{sec:'Eficacitatea colectivă a profesorilor',q:'Ce este mai important, potrivit textului, într-o cultură a eficacității colective?',o:['O modalitate comună de predare.','O limbă comună despre învățare și impact.','Aceleași materiale didactice pentru toți profesorii.','Aceeași structură a fiecărei lecții.'],a:1},
{sec:'Eficacitatea colectivă a profesorilor',q:'Care dintre următoarele formulări apare ca reprezentativă pentru culturile în care eficacitatea colectivă este prezentă?',o:['Suntem administratori, suntem observatori, suntem independenți.','Suntem evaluatori, suntem agenți de schimbare și colaborăm.','Suntem facilitatori, suntem neutri și lucrăm separat.','Suntem executanți, suntem constanți și evităm schimbarea.'],a:1},
{sec:'Eficacitatea colectivă a profesorilor',q:'De ce avertizează Hattie că simpla colaborare dintre profesori nu este suficientă?',o:['Pentru că profesorii nu trebuie să discute despre elevi.','Pentru că întâlnirile și lucrul împreună pot exista fără analizarea autentică a impactului asupra elevilor.','Pentru că eficacitatea colectivă presupune exclusiv muncă individuală.','Pentru că orice colaborare reduce autonomia profesorilor.'],a:1},
{sec:'Eficacitatea colectivă a profesorilor',q:'Ce caracterizează o cercetare colaborativă productivă din punct de vedere pedagogic?',o:['Evitarea opiniilor diferite pentru a păstra consensul.','Argumentarea pe bază de dovezi, interpretarea, analiza critică și acceptarea mai multor perspective.','Discuții concentrate exclusiv pe resurse și volum de muncă.','Relatarea experiențelor individuale fără verificarea lor prin dovezi.'],a:1},
{sec:'Eficacitatea colectivă a profesorilor',q:'Ce rol are conducerea școlii în dezvoltarea eficacității colective?',o:['Să reducă frecvența colaborărilor pentru a evita conflictele.','Să creeze o cultură a colaborării axată pe impact, progres, rezultat și utilizarea dovezilor fiabile.','Să stabilească o singură metodă de predare pentru toți profesorii.','Să lase colaborarea exclusiv la inițiativa informală a profesorilor.'],a:1},
{sec:'Eficacitatea colectivă a profesorilor',q:'Ce condiții trebuie să creeze conducerea pentru ca profesorii să poată colabora productiv?',o:['Colaborări rare și informale.','Colaborări formale, frecvente și productive, susținute de un nivel ridicat de încredere.','Doar întâlniri administrative periodice.','Competiție între profesori pentru rezultate mai bune.'],a:1},
{sec:'Eficacitatea colectivă a profesorilor',q:'Care dintre următoarele elemente este asociat dezvoltării eficacității colective?',o:['Sensibilitate socială, reciprocitate, conștientizare socială și încredere în abilitățile celuilalt.','Reducerea schimbului de opinii pentru evitarea tensiunilor.','Uniformizarea completă a stilurilor de predare.','Limitarea responsabilității la activitatea individuală.'],a:0},
{sec:'Eficacitatea colectivă a profesorilor',q:'Care este concluzia esențială privind eficacitatea colectivă?',o:['Ea înseamnă în principal că profesorii se întâlnesc și lucrează împreună.','Accentul trebuie să cadă pe maximizarea impactului asupra elevilor, nu doar pe faptul că profesorii colaborează.','Ea se măsoară prin numărul de activități comune ale profesorilor.','Ea apare automat atunci când există relații bune în cancelarie.'],a:1}
]
};

let questions=[],i=0,score=0,currentModule='';
const quizCard=document.getElementById('quizCard'),resultCard=document.getElementById('resultCard'),qnum=document.getElementById('qnum'),section=document.getElementById('section'),bar=document.getElementById('bar'),question=document.getElementById('question'),options=document.getElementById('options'),feedback=document.getElementById('feedback'),check=document.getElementById('check'),next=document.getElementById('next'),scoreEl=document.getElementById('score'),scoreText=document.getElementById('scoreText');

function startModule(name){currentModule=name;questions=modules[name];i=0;score=0;resultCard.classList.add('hidden');quizCard.classList.remove('hidden');render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function render(){check.disabled=false;next.disabled=true;feedback.className='feedback';feedback.textContent='';const x=questions[i];qnum.textContent='Întrebarea '+(i+1)+' din '+questions.length;section.textContent=x.sec;bar.style.width=((i/questions.length)*100)+'%';question.textContent=x.q;options.innerHTML='';x.o.forEach((t,n)=>{const lab=document.createElement('label');lab.className='option';lab.innerHTML='<input type="radio" name="opt" value="'+n+'"><span><strong>'+String.fromCharCode(65+n)+'.</strong> '+t+'</span>';options.appendChild(lab)})}
check.onclick=()=>{const sel=document.querySelector('input[name="opt"]:checked');if(!sel){feedback.className='feedback bad';feedback.textContent='Selectează mai întâi o variantă.';return}const v=Number(sel.value),x=questions[i];document.querySelectorAll('.option').forEach((el,n)=>{el.querySelector('input').disabled=true;if(n===x.a)el.classList.add('correct');if(n===v&&v!==x.a)el.classList.add('wrong')});if(v===x.a){score++;feedback.className='feedback ok';feedback.innerHTML='<b>Corect.</b>'}else{feedback.className='feedback bad';feedback.innerHTML='<b>Greșit. Răspunsul corect este '+String.fromCharCode(65+x.a)+'.</b>'}check.disabled=true;next.disabled=false};
next.onclick=()=>{if(i<questions.length-1){i++;render()}else finish()};
function finish(){bar.style.width='100%';quizCard.classList.add('hidden');resultCard.classList.remove('hidden');scoreEl.textContent=score+' / '+questions.length;scoreText.textContent='Ai răspuns corect la '+Math.round(score/questions.length*100)+'% dintre itemi.'}
function home(){speechSynthesis.cancel();quizCard.classList.add('hidden');resultCard.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('restart').onclick=()=>startModule(currentModule);
document.getElementById('backHome').onclick=home;
document.getElementById('backHome2').onclick=home;

let utter=null;
document.getElementById('listen').onclick=()=>{speechSynthesis.cancel();const x=questions[i];utter=new SpeechSynthesisUtterance(x.q+'. '+x.o.map((v,n)=>String.fromCharCode(65+n)+'. '+v).join('. '));utter.lang='ro-RO';utter.rate=0.92;speechSynthesis.speak(utter)};
document.getElementById('pause').onclick=()=>speechSynthesis.pause();
document.getElementById('resume').onclick=()=>speechSynthesis.resume();
document.getElementById('stop').onclick=()=>speechSynthesis.cancel();
</script>
</body>
</html>
